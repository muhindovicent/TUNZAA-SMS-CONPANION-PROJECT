name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tunza_test
          POSTGRES_USER: tunza
          POSTGRES_PASSWORD: tunza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tunza -d tunza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql+psycopg://tunza:tunza@localhost:5432/tunza_test
      TEST_DATABASE_URL: postgresql+psycopg://tunza:tunza@localhost:5432/tunza_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: bandit -c pyproject.toml -r src -q
      - run: pip-audit --skip-editable --timeout 90
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest --cov=tunza --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
