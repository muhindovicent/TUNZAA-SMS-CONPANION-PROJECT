[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunza"
version = "0.1.0"
description = "Tunza maternal health SMS companion platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Zest Technologies" }]
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "Authlib==1.9.1",
    "cryptography==50.0.2",
    "Flask==3.1.3",
    "gunicorn==23.0.0",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.6",
    "structlog==25.5.0",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "hypothesis==6.170.14",
    "mypy==1.20.2",
    "pip-audit==2.10.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.coverage.run]
source = ["tunza"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["flask.*", "werkzeug.*", "structlog.*", "opentelemetry.*", "alembic.*", "gunicorn.*"]
ignore_missing_imports = true
